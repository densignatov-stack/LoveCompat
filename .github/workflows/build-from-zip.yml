name: Build LoveCompat APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p build-src
          unzip -q LoveCompat-Android-v1.0-CLOUD.zip -d build-src

      - name: Configure AndroidX
        working-directory: build-src/compatibility_app
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin JVM targets
        working-directory: build-src/compatibility_app
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          // CI compatibility: use the same JVM target for Java and Kotlin
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Build APK
        working-directory: build-src/compatibility_app
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveCompat-v1.0-APK
          path: build-src/compatibility_app/app/build/outputs/apk/debug/*.apk
