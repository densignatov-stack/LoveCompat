name: Build LoveCompat APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p build-src
          unzip -q LoveCompat-Android-v1.0-CLOUD.zip -d build-src

      - name: Configure AndroidX
        working-directory: build-src/compatibility_app
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM targets
        working-directory: build-src/compatibility_app
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

            - name: Fix MainActivity
        working-directory: build-src/compatibility_app
        run: |
          FILE="app/src/main/java/com/example/lovecompat/MainActivity.kt"

          # Fix unavailable photo icon
          sed -i 's/AddAPhoto/Add/g' "$FILE"
          sed -i '/import androidx.compose.material.icons.filled.AddAPhoto/d' "$FILE"

          if ! grep -q 'import androidx.compose.material.icons.filled.Add' "$FILE"; then
            sed -i '/^package /a import androidx.compose.material.icons.filled.Add' "$FILE"
          fi

          # Fix setContent import
          if ! grep -q 'import androidx.activity.compose.setContent' "$FILE"; then
            sed -i '/^package /a import androidx.activity.compose.setContent' "$FILE"
          fi

          # Remove broken animation expression
          sed -i 's/animateFloatAsState([^)]*)/1f/g' "$FILE"

          # Remove animation imports if they exist
          sed -i '/import androidx.compose.animation.core.animateFloat/d' "$FILE"
          sed -i '/import androidx.compose.animation.core.animateFloatAsState/d' "$FILE"
      - name: Build APK
        working-directory: build-src/compatibility_app
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveCompat-v1.0-APK
          path: build-src/compatibility_app/app/build/outputs/apk/debug/*.apk
